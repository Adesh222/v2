version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediqueue-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
    networks:
      - mediqueue-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediqueue-frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - mediqueue-net

  mongo:
    image: mongo:6.0
    container_name: mediqueue-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - mediqueue-net

volumes:
  mongo-data:

networks:
  mediqueue-net:
    driver: bridge
